<h4 class="headline">Spritpreise</h4>
<div id="settings">
  <section>
    <h6 class="überschrift">Type</h6>
    <h6 data-fuel-type></h6>
  </section>
  <section>
    <h6 class="überschrift">Sortierung</h6>
    <h6 data-sort-type></h6>
  </section>
  <section>
    <h6 class="überschrift">Umkreis:</h6>
    <h6><span data-radius-type></span>km</h6>
  </section>
  <section>
    <h6 class="überschrift">Nur geöffnete</h6>
    <h6 data-open-type></h6>
  </section>
</div>

<article>
  <ul data-stations></ul>
</article>

<h6 id="lastRefresh">zuletzt aktualisiert: <span data-last-refresh></span></h6>

<template id="station-template">
  <li>
    <p class="preis"><span data-price></span>€</p>
    <p class="entfernung"><span data-distanz></span>km</p>

    <p class="brandCity"><span data-name></span><span data-city></span></p>
  </li>
</template>
